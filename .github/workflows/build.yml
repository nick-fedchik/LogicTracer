name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-serialport-dev nlohmann-json3-dev \
            iverilog verilator yosys
      - name: Configure (warnings as errors)
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  macos:
    # Homebrew Qt 6 on Apple silicon: build with warnings as errors and run every test.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja qt nlohmann-json
      - name: Configure (warnings as errors)
        run: cmake --preset debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset debug

  windows:
    # Port in progress (B-07): MSVC 2022 + Qt 6.8; tests that need the pty emulator are skipped.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true
      - name: nlohmann-json
        run: vcpkg install nlohmann-json:x64-windows
      - name: Configure
        run: cmake --preset default -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
      - name: Build
        run: cmake --build --preset default -- -k 0  # report every failing file at once
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset default
      - name: Diagnose failing suites
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($t in @("core", "connection", "gui", "session", "mcp")) {
            $exe = (Get-ChildItem build -Recurse -Filter "logictracer-$t-tests.exe" | Select-Object -First 1).FullName
            & $exe -o "$t.txt,txt" -v1 | Out-Null
            Write-Host "=== $t exit code $LASTEXITCODE (last lines) ==="
            if (Test-Path "$t.txt") { Get-Content "$t.txt" -Tail 15 }
          }

  firmware:
    # Compile-only check of the RP2040 firmware (nothing is flashed). Not yet a required check.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential libusb-1.0-0-dev pkg-config git
      - name: Fetch the Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb lib/cyw43-driver lib/lwip
      - name: Build (Pico, Pico 2, Pico W USB and WiFi, Interceptor variants)
        run: |
          for board in BOARD_PICO BOARD_PICO_2 BOARD_PICO_W BOARD_PICO_W_WIFI BOARD_PICO_2_W_WIFI BOARD_INTERCEPTOR; do
            cmake -S firmware/rp2040 -B "build-fw-$board" -G Ninja -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
              -DBOARD_TYPE=$board -DTURBO_MODE=0
            cmake --build "build-fw-$board"
          done
